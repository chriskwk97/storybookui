<section class="p-4">
  <h1 class="font-size-h1 color-city-blue">Folder structure — before / after</h1>
  <div class="grid grid-cols-2 gap-8 pt-4">
    <mat-card class="!bg-city-neutral-light">
      <mat-card-header>
        <mat-card-title class="font-size-h3 color-city-blue">Before — flat</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <pre class="font-size-small-text overflow-auto">{{ before }}</pre>
      </mat-card-content>
    </mat-card>
    <mat-card class="!bg-city-neutral-light">
      <mat-card-header>
        <mat-card-title class="font-size-h3 color-city-blue">After — feature-based</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <pre class="font-size-small-text overflow-auto">{{ after }}</pre>
      </mat-card-content>
    </mat-card>
  </div>
</section>
