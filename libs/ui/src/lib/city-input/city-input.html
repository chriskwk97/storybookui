<mat-form-field class="w-full" appearance="outline">
  @if (label()) {
    <mat-label>{{ label() }}</mat-label>
  }
  <input
    matInput
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="disabled()"
    [required]="required()"
    (input)="handleInput($any($event.target).value)"
    (blur)="handleBlur()"
  />
  @if (hint() && !showError()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
  @if (showError()) {
    <mat-error>{{ errorMessage() }}</mat-error>
  }
</mat-form-field>
